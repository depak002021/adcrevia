# nginx site for Adcrevia on the VPS host (not inside Docker).
#
# Install:
#   sudo cp deploy/nginx/adcrevia.conf /etc/nginx/sites-available/adcrevia.conf
#   sudo ln -s /etc/nginx/sites-available/adcrevia.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Obtain the certificate FIRST (docs/deployment/hostinger-vps.md, step 5), otherwise
# `nginx -t` fails on the ssl_certificate paths below.
#
# If you chose a different APP_PORT in .env.production, change 127.0.0.1:3000 below.

upstream adcrevia_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Plain HTTP: certificate renewals, then everything else to the one canonical origin.
server {
    listen 80;
    listen [::]:80;
    server_name adcrevia.com www.adcrevia.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://adcrevia.com$request_uri;
    }
}

# www over HTTPS -> apex. APP_URL is the apex, and the app's cross-origin guard refuses
# form posts from any other origin, so www must never serve the app directly.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.adcrevia.com;

    ssl_certificate     /etc/letsencrypt/live/adcrevia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adcrevia.com/privkey.pem;

    return 301 https://adcrevia.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name adcrevia.com;

    ssl_certificate     /etc/letsencrypt/live/adcrevia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adcrevia.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:adcrevia_ssl:10m;
    ssl_session_timeout 1d;

    # Product photos and logos are uploaded through the app.
    client_max_body_size 25m;

    # Security headers (CSP, HSTS, frame, referrer) are set by the application itself in
    # src/lib/security/headers.ts. Not repeated here, so there is one place to change them.

    # Shared proxy settings.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # X-Real-IP is OVERWRITTEN with the address nginx accepted the connection from. The app
    # rate-limits on it (src/lib/security/rate-limit.ts), so it must not be client-supplied.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Live project updates are a Server-Sent Events stream. Buffering would hold every
    # event until the buffer fills, so the studio would appear frozen.
    location ~ ^/api/projects/[^/]+/events$ {
        proxy_pass http://adcrevia_app;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://adcrevia_app;
        # Generation and render requests can take a while to answer.
        proxy_read_timeout 120s;
    }
}
