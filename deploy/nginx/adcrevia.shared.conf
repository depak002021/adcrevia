# ─────────────────────────────────────────────────────────────────────────
# adcrevia.com — vhost for the SHARED public nginx on this VPS
# (container: schoolagam_nginx, conf.d = /var/www/schoolagam/nginx).
# Installed by deploy/go-live.sh and the "Deploy adcrevia Nginx" workflow.
# (deploy/nginx/adcrevia.conf is the host-nginx variant; unused on this VPS.)
#
# IMPORTANT: never load this file before /etc/letsencrypt/live/adcrevia.com
# exists, or nginx fails its config test / start and every site goes down.
# go-live.sh enforces the order and always runs `nginx -t` before reloading.
#
# Cert renewal is automatic: certbot.timer on the host (webroot /var/www/certbot)
# + /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh reloads this nginx.
# ─────────────────────────────────────────────────────────────────────────

# Plain HTTP: ACME challenges, then everything to the one canonical origin.
server {
    listen 80;
    server_name adcrevia.com www.adcrevia.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://adcrevia.com$request_uri;
    }
}

# www over HTTPS -> apex. APP_URL is the apex and the app's cross-origin guard
# refuses form posts from any other origin, so www must never serve the app.
server {
    listen 443 ssl;
    http2 on;
    server_name www.adcrevia.com;

    ssl_certificate     /etc/letsencrypt/live/adcrevia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adcrevia.com/privkey.pem;

    return 301 https://adcrevia.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name adcrevia.com;

    ssl_certificate     /etc/letsencrypt/live/adcrevia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adcrevia.com/privkey.pem;

    # Product photos and logos are uploaded through the app.
    client_max_body_size 25m;

    # Security headers (CSP, HSTS, frame, referrer) are set by the app itself
    # in src/lib/security/headers.ts — deliberately not repeated here.

    # Docker's embedded DNS + a variable upstream: the name is resolved at
    # request time, so nginx still starts (and the other sites stay up) even
    # when the adcrevia container is down.
    resolver 127.0.0.11 valid=30s;
    set $adcrevia_app http://adcrevia-app:3000;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # OVERWRITTEN with the connecting address; the app rate-limits on it
    # (src/lib/security/rate-limit.ts), so it must never be client-supplied.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 10s;

    # Live project updates are Server-Sent Events; buffering would freeze them.
    location ~ ^/api/projects/[^/]+/events$ {
        proxy_pass $adcrevia_app;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        gzip off;
    }

    location / {
        proxy_pass $adcrevia_app;
        # Generation and render requests can take a while to answer.
        proxy_read_timeout 120s;
    }
}
